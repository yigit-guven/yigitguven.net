<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="rad_google-play" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0f4c75"/>
      <stop offset="100%" stop-color="#082032"/>
    </radialGradient>
    <linearGradient id="glow_google-play" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2d3" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <pattern id="pat_google-play" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="25" cy="25" r="1.5" fill="rgba(0, 210, 211, 0.15)"/>
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(0, 210, 211, 0.15)" stroke-width="0.5" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#rad_google-play)"/>
  <rect width="100%" height="100%" fill="url(#pat_google-play)"/>
  <rect width="100%" height="100%" fill="url(#glow_google-play)"/>

  <circle cx="600" cy="460" r="280" fill="#00d2d3" opacity="0.08" filter="blur(60px)"/>
  <circle cx="600" cy="480" r="140" fill="none" stroke="#00d2d3" stroke-width="2" opacity="0.25" stroke-dasharray="8 6"/>
  <circle cx="600" cy="480" r="90" fill="#00d2d3" opacity="0.12"/>
</svg>